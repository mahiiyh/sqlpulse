services:
  # Backend Service
  - type: web
    name: sqlpulse-backend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./backend/Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: info

  # Scheduler Service
  - type: web
    name: sqlpulse-scheduler
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./scheduler/Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3002
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: ENCRYPTION_KEY
        fromService:
          name: sqlpulse-backend
          type: web
          envVarKey: ENCRYPTION_KEY
      - key: LOG_LEVEL
        value: info

  # Frontend Service
  - type: web
    name: sqlpulse-frontend
    runtime: docker
    region: oregon
    plan: free
    dockerfilePath: ./frontend/Dockerfile
    healthCheckPath: /
    envVars:
      - key: VITE_API_BASE_URL
        value: https://sqlpulse-backend.onrender.com/api
