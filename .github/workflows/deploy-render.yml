name: Deploy to Render (Free)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: |
          echo "Render will auto-deploy from GitHub connection"
          echo "No manual deployment needed - services deploy automatically on push"
          
      - name: Notify deployment
        run: |
          echo "✅ Code pushed to main branch"
          echo "🚀 Render will automatically deploy all services"
          echo "⏱️  Deployment takes ~5-10 minutes"
          echo "📊 Check status at: https://dashboard.render.com"
