name: Deploy Backend & Scheduler to Railway

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'scheduler/**'
      - 'database/**'
      - '.github/workflows/deploy-railway.yml'
  workflow_dispatch:

jobs:
  deploy-backend:
    name: Deploy Backend to Railway
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Backend
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd backend
          railway up --service backend

      - name: Wait for deployment
        run: sleep 30

      - name: Verify Backend Health
        run: |
          curl -f https://backend-production-1cc3.up.railway.app/api/health || exit 1
          
  deploy-scheduler:
    name: Deploy Scheduler to Railway
    runs-on: ubuntu-latest
    needs: deploy-backend
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy Scheduler
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          cd scheduler
          railway up --service scheduler

      - name: Verify Scheduler Health
        run: |
          echo "Scheduler deployed successfully"
          
  notify-success:
    name: Notify Deployment Success
    runs-on: ubuntu-latest
    needs: [deploy-backend, deploy-scheduler]
    if: success()
    
    steps:
      - name: Deployment Summary
        run: |
          echo "✅ Backend deployed to Railway"
          echo "✅ Scheduler deployed to Railway"
          echo "🚀 Production: https://backend-production-1cc3.up.railway.app"
          echo "📊 Database: Neon PostgreSQL"
